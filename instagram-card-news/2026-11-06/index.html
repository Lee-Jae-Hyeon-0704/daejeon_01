<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>누들대전축제 카드뉴스 · 2026-11-06</title>
<style>
  :root { --bg: #FFF8EA; --ink: #4A2A1A; --muted: #6B4A36; --line: #E8D9C4; }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--ink); font-family: "Noto Sans KR", "Apple SD Gothic Neo", "Malgun Gothic", sans-serif; }
  main { max-width: 1120px; margin: 0 auto; padding: 32px 16px 64px; }
  h1 { margin: 0 0 4px; font-size: 28px; }
  p { margin: 0 0 24px; color: var(--muted); }
  h2 { font-size: 18px; margin: 40px 0 12px; }
  .swipe { display: flex; gap: 12px; overflow-x: auto; scroll-snap-type: x mandatory; padding-bottom: 12px; max-width: 432px; }
  .swipe img { flex: 0 0 100%; width: 100%; aspect-ratio: 4 / 5; scroll-snap-align: start; border-radius: 8px; border: 1px solid var(--line); }
  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 16px; }
  figure { margin: 0; }
  .grid img { width: 100%; aspect-ratio: 4 / 5; display: block; border-radius: 8px; border: 1px solid var(--line); }
  figcaption { font-size: 14px; color: var(--muted); margin-top: 6px; }
  a { color: #B5440A; }
</style>
</head>
<body>
<main>
  <h1>2026 누들대전축제 인스타 카드뉴스</h1>
  <p>2026-11-06 작업 마지막 상태 · 1080×1350 (4:5) · 8장 · <a href="../README.md">날짜별 작업 기록</a></p>

  <h2>넘겨보기</h2>
  <div class="swipe" aria-label="카드뉴스 넘겨보기">
    <img src="card-01.png" alt="1장 표지">
    <img src="card-02.png" alt="2장 왜 하필 대전?">
    <img src="card-03.png" alt="3장 한눈에 보기">
    <img src="card-04.png" alt="4장 쿠킹쇼">
    <img src="card-05.png" alt="5장 경연 및 오감대전">
    <img src="card-06.png" alt="6장 체험 및 버스킹">
    <img src="card-07.png" alt="7장 이벤트">
    <img src="card-08.png" alt="8장 마무리">
  </div>

  <h2>전체 보기</h2>
  <div class="grid">
    <figure><img src="card-01.png" alt=""><figcaption>01 표지</figcaption></figure>
    <figure><img src="card-02.png" alt=""><figcaption>02 왜 하필 대전?</figcaption></figure>
    <figure><img src="card-03.png" alt=""><figcaption>03 한눈에 보기</figcaption></figure>
    <figure><img src="card-04.png" alt=""><figcaption>04 쿠킹쇼</figcaption></figure>
    <figure><img src="card-05.png" alt=""><figcaption>05 경연 &amp; 오감대전</figcaption></figure>
    <figure><img src="card-06.png" alt=""><figcaption>06 체험 &amp; 버스킹</figcaption></figure>
    <figure><img src="card-07.png" alt=""><figcaption>07 이벤트</figcaption></figure>
    <figure><img src="card-08.png" alt=""><figcaption>08 마무리</figcaption></figure>
  </div>
</main>
</body>
</html>
